
[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanlake"
version = "0.1.0"
description = "Urban service data lakehouse and predictive intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1", "pydantic==2.11.7", "fastapi==0.116.1",
  "uvicorn==0.35.0", "confluent-kafka==2.11.1", "redis==6.4.0",
  "prometheus-client==0.22.1", "pandas==2.3.1", "scikit-learn==1.7.1",
  "joblib==1.5.1", "mlflow==3.2.0", "psycopg2-binary==2.9.10",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.9"]
spark = ["pyspark==4.0.1", "delta-spark==4.0.0"]

[project.scripts]
urbanlake = "urbanlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = ["integration: requires Docker services", "spark: requires Java and Spark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
